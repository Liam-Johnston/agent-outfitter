name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      # `smoke/app/harness/*.ts` is documentation consumers are invited to copy,
      # and Bun strips types without checking them, so without this an example
      # that does not compile would still pass CI.
      - run: bun run typecheck:smoke
      - run: bun test
      - run: bun run build

      # The published entrypoint must link and run under plain Node across every
      # supported major, not just under Bun: the package targets Node >= 18 and
      # has no Bun dependency. Node validates ESM exports at link time, so a
      # broken export list fails here rather than in a consumer's install.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the built package loads under Node 20
        run: node --input-type=module -e "$(cat scripts/verify-dist.mjs)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the built package loads under Node 24
        run: node --input-type=module -e "$(cat scripts/verify-dist.mjs)"

      # A real consumer resolves types through package.json "exports". This
      # catches a d.ts that only compiles inside this repo's tsconfig.
      - name: Verify the published types resolve for a consumer
        run: bun run verify:types

  # Install into a fresh container from the packed tarball, over the real
  # network, and check that the harness can see the result. This is the coverage
  # `build` structurally cannot provide: it runs against `local:` sources inside
  # one process, so nothing there exercises the published package resolving as a
  # dependency, a live host pinning a ref to a commit, or the SDK handoff pointing
  # where the install actually wrote.
  #
  # A separate job rather than a step in `build`, so the fast checks are not held
  # behind a Docker build, and one matrix entry per run so they go in parallel and
  # a failure names which one broke.
  #
  # `aidlc` is a different shape of claim from the other two: not "did the default
  # paths resolve and does sdkOptions() point at them", but "did a whole committed
  # harness arrive complete, and did it leave the operator's own settings.json
  # intact". It needs no special casing here because it is a compose service with
  # its own entrypoint.
  smoke:
    runs-on: ubuntu-latest
    # The token is passed only to lift the anonymous API rate limit while
    # resolving public refs, so read access is all it needs.
    permissions:
      contents: read
    strategy:
      # Report every entry even when one fails: "Codex passed, Claude did not"
      # localizes the problem far faster than a single cancelled run.
      fail-fast: false
      matrix:
        harness: [codex, claude, aidlc]
    steps:
      - uses: actions/checkout@v4

      # Layer cache keyed on the lockfile and sources: the two matrix entries
      # build the same image, and a cache hit turns the second one into a no-op.
      - uses: docker/setup-buildx-action@v3

      - name: Build the smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: smoke/Dockerfile
          tags: agent-outfitter-smoke:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container runs as the runner's uid so the output is readable by the
      # artifact step below; on Linux there is no ownership remapping, and root
      # would leave files the runner can neither upload nor delete.
      - name: Run the smoke test
        run: |
          mkdir -p test-output/${{ matrix.harness }}
          SMOKE_UID="$(id -u)" SMOKE_GID="$(id -g)" \
            docker compose -f smoke/docker-compose.yml run --rm ${{ matrix.harness }}
        env:
          # Lifts the anonymous GitHub API rate limit, which a shared runner IP
          # hits readily. Read-only; the smoke test only resolves public refs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploaded on failure too: the installed tree is the evidence for why an
      # assertion failed, and it is gone once the runner is recycled.
      - name: Upload the installed tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ matrix.harness }}
          path: test-output/${{ matrix.harness }}
          # Required, not optional: almost everything installed lives under
          # `.codex/` or `.claude/`, and this action excludes dotted paths by
          # default, so without it the artifact would quietly contain only the
          # lockfile.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
