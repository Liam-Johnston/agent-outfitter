name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # The published entrypoint must import and run under plain Node, not just
      # Bun — the package targets Node >= 18 and lists no Bun dependency.
      - name: Verify the built package loads under Node
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.createAgentManager !== 'function') { throw new Error('missing createAgentManager export'); } console.log('dist/index.js loads under Node ' + process.version); })"
