# Example manifest, in the YAML form. Equivalent to examples/outfitter.config.ts,
# minus the ability to compute values. This form is machine-editable, so
# `add()` and `remove()` can write it back.
version: 1

targets: [codex, claude]

# Skills: folders the harness discovers on its own.
sources:
  - ref: github:anthropics/skills#main
    select: [pdf, xlsx, docx]
  - github:anthropics/skills/skills/mcp-builder
  - ref: github:acme/internal-skills#main
    auth: { env: SKILLS_TOKEN }
  - local:./skills

# MCP servers: configured into each target, never copied as files.
mcp:
  - name: github
    transport: http
    url: https://api.githubcopilot.com/mcp/
    auth: { bearerEnv: GITHUB_MCP_TOKEN }
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]

# Instruction fragments: merged into AGENTS.md / CLAUDE.md inside marked
# regions, leaving your own prose in those files untouched.
instructions:
  - ref: github:acme/agent-config/instructions
    select: [house-style, review-*]
  - ref: github:acme/agent-config/instructions/tone.md
    name: voice
  - local:./instructions

# Bundles: opaque subtrees copied verbatim to declared destinations. This is how
# a committed harness (engine scripts, knowledge, hooks) installs, since none of
# those directories announce themselves the way a skill folder does. Declared
# rather than discovered, so `select:` globs do not apply.
bundles:
  - ref: github:awslabs/aidlc-workflows/dist/claude#v2
    name: aidlc-engine
    paths:
      .claude/tools: .claude/tools
      .claude/hooks: .claude/hooks
      .claude/knowledge: .claude/knowledge
      # A bundle may write outside .claude/, which is why executableHarness below
      # has to be opted into.
      aidlc: aidlc

# Settings: merged into .claude/settings.json key by key, so a settings file you
# wrote yourself keeps everything it holds. Ownership is recorded in the lockfile,
# which is what lets `remove()` unwind exactly these keys and nothing else.
settings:
  - ref: github:awslabs/aidlc-workflows/dist/claude/.claude/settings.json#v2
    name: aidlc
  - name: local-overrides
    settings:
      env: { AWS_REGION: eu-west-2 }

policy:
  allowedHosts: [github.com]
  allowedOwners: [acme, anthropics, awslabs]
  requireLockHashMatch: true
  scripts: warn
  # Bundles that install executable files, and settings fragments that register
  # hooks or a status line, default to "deny": that code runs on every tool call
  # whether or not anything invokes it. "warn" installs and reports what was
  # registered; "allow" installs silently.
  executableHarness: warn
  scan: warn
  allowTransitiveMcp: false
  allowTransitiveInstructions: false
  allowedMcpHosts: [api.githubcopilot.com]
